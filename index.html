<style>
  :root{
    --sage:#B8C39E;
    --sage-soft:#DCE4CC;
    --cream:#EDDDC7;
    --bg:#FFFEFD;
    --card:#FFFEFD;
    --ink:#503018;
    --ink-soft:#503018;
    --arrow:rgba(80,48,24,0.55);
    --mustard:#F0B058;
    --mustard-deep:#E0994A;
    --gray-dot:#C9C4B8;
    --line:#E8DBCD;
    --line-card:#E8DBCD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:0 0 40px;
  }
  .app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:24px;
  }
  .home-screen{
    display:none;
  }
  .home-screen.active{
    display:block;
  }
  /* ヘッダー */
  .topbar{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:12px 22px 0;
  }
  .icon-btn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0; cursor:pointer;
  }
  .icon-btn img{ width:26px; height:auto; display:block; }
  .icon-btn.settings img{ width:24px; }

  .hero{
    text-align:center;
    padding:0 24px 0;
  }
  .hero img{
    width:88px; height:auto;
    margin:0 auto 14px;
    display:block;
  }
  .hero h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:27px;
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  .hero .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 20px;
    letter-spacing:.02em;
  }
  .hero .leaf-divider{
    display:block;
    width:364px;
    max-width:100%;
    height:auto;
    margin:0 auto 20px;
  }

  /* 月セレクター */
  .month-select{
    margin:0 24px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    background:#F4ECE3;
    border:none;
    border-radius:8px;
    padding:6px 18px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:500;
    font-size:14.5px;
    color:var(--ink);
    width:fit-content;
    cursor:pointer;
    position:relative;
  }
  .month-select .chev{
    width:9px;
    height:9px;
    border-right:2.5px solid var(--ink);
    border-bottom:2.5px solid var(--ink);
    display:inline-block;
    margin-left:3px;
    transform:rotate(45deg);
    transition:transform .2s;
  }
  .month-select.open .chev{ transform:rotate(225deg); }

  .month-dropdown{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:50%;
    transform:translateX(-50%);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 8px 24px rgba(80,48,24,0.10);
    padding:6px;
    min-width:150px;
    z-index:20;
  }
  .month-dropdown.open{ display:block; }
  .month-dropdown .m-item{
    padding:10px 14px;
    font-size:14px;
    font-family:'Zen Maru Gothic', sans-serif;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
  }
  .month-dropdown .m-item:hover{ background:var(--sage-soft); }
  .month-dropdown .m-item.current{ background:var(--sage); font-weight:700; }

  /* 未精算の合計 */
  .summary-block{
    margin:0 24px 26px;
    text-align:left;
  }
  .summary-label{
    font-size:13.5px;
    color:var(--ink-soft);
    letter-spacing:.05em;
    margin-bottom:10px;
  }
  .summary-value{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:40px;
    line-height:1;
    color:var(--ink);
  }

  /* 店舗カード */
  .card-list{
    margin:0 20px 21px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  .store-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line-card);
    border-radius:18px;
    padding:15px 18px;
    cursor:pointer;
  }
  .store-card:active{ transform:scale(0.99); }
  .status-dot{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--sage);
    flex-shrink:0;
  }
  .status-dot.settled{ background:var(--gray-dot); }
  .store-info{
    flex:1;
    min-width:0;
  }
  .store-name{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:16px;
    font-weight:500;
    margin-bottom:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .store-date{
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .store-right{
    text-align:right;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .store-amount-count{
    text-align:right;
  }
  .store-amount{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:17px;
    display:block;
  }
  .store-count{
    font-size:13px;
    color:var(--ink-soft);
    display:block;
    margin-top:2px;
  }
  .chevron{
    font-size:30px;
    color:var(--ink);
    font-weight:400;
    margin-left:6px;
  }

  /* 追加ボタン */
  .add-btn{
    display:block;
    width:calc(100% - 56px);
    margin:31px auto 0;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:16px;
    font-weight:700;
    background:#F3C16B;
    color:var(--ink);
    border:1px solid var(--line-card);
    border-radius:13px;
    padding:14px 19px;
    cursor:pointer;
  }
  .add-btn:active{ transform:scale(0.98); }

  /* 空状態 */
  .empty-state{
    text-align:center;
    padding:45px 24px 8px;
  }
  .empty-state .msg1{
    font-family:'Zen Kaku Gothic New', 'Meiryo', 'Noto Sans JP', sans-serif;
    font-size:15.5px;
    margin-bottom:10px;
  }
  .empty-state .msg2{
    font-family:'Zen Kaku Gothic New', 'Meiryo', 'Noto Sans JP', sans-serif;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.8;
    margin-bottom:28px;
  }
  .empty-state img{
    width:85px;
    height:auto;
    margin:0 auto;
    display:block;
    opacity:0.95;
  }

  /* ===== 詳細画面 ===== */
  .detail-app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:var(--bg);
    padding:20px 22px 28px;
    display:none;
  }
  .detail-app.active{
    display:block;
  }
  .detail-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .detail-back{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    width:30px;
    height:30px;
    color:var(--ink);
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
  .detail-back svg{
    display:block;
  }
  .detail-store-name{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
    flex:1;
    text-align:center;
  }
  .detail-edit-btn{
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    color:var(--ink-soft);
    padding:0;
    cursor:pointer;
    flex-shrink:0;
  }
  .detail-summary-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .detail-date-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#F4ECE3;
    border-radius:8px;
    padding:6px 18px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:500;
    font-size:14.5px;
    color:var(--ink);
    font-feature-settings:"palt" 1;
    letter-spacing:0;
  }
  .detail-total-block{
    display:flex;
    align-items:baseline;
    gap:16px;
    white-space:nowrap;
  }
  .detail-total-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:0;
  }
  .detail-total-value{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--ink);
  }
  .detail-item-list{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:16px;
  }
  .detail-item-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .detail-item-dot{
    width:11px; height:11px;
    border-radius:50%;
    background:var(--sage);
    flex-shrink:0;
  }
  .detail-item-name{
    flex:1;
    font-size:15px;
    color:var(--ink);
  }
  .detail-item-price{
    font-size:15px;
    color:var(--ink);
  }
  .detail-divider{
    display:block;
    width:364px;
    max-width:100%;
    height:auto;
    margin:4px auto 10px;
  }
  .detail-memo-row{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:26px;
    cursor:pointer;
  }
  .detail-memo-row svg{
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .detail-settle-btn{
    display:block;
    width:100%;
    background:#F3C16B;
    color:var(--ink);
    border:1px solid var(--line-card);
    border-radius:13px;
    padding:14px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:16px;
    text-align:center;
    cursor:pointer;
  }
  .detail-settle-btn:active{ transform:scale(0.98); }
  .detail-delete-link{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:#A27D7F;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:13px;
    text-align:center;
    padding:16px 0 0;
    cursor:pointer;
    text-decoration:underline;
  }

  /* ===== 設定・入力・月管理 共通(detail-appを流用) ===== */
  .form-group{ margin-bottom:18px; }
  .form-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
    display:block;
  }
  .form-input, .form-textarea{
    width:100%;
    border:1px solid var(--line-card);
    border-radius:10px;
    padding:11px 13px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--card);
    box-sizing:border-box;
  }
  .form-textarea{ resize:vertical; min-height:70px; }
  .form-input:focus, .form-textarea:focus{
    outline:none;
    border-color:var(--sage);
  }
  input[type="date"].form-input{
    accent-color:var(--sage);
  }
  .autocomplete-wrap{ position:relative; }
  .autocomplete-list{
    position:absolute;
    top:calc(100% + 4px);
    left:0; right:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 8px 20px rgba(80,48,24,0.12);
    max-height:220px;
    overflow-y:auto;
    z-index:30;
    display:none;
  }
  .autocomplete-list.open{ display:block; }
  .autocomplete-item{
    padding:11px 14px;
    font-size:14.5px;
    cursor:pointer;
  }
  .autocomplete-item:hover{ background:var(--sage-soft); }

  .item-input-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
  }
  .item-input-row .item-name-input{ flex:1; }
  .item-input-row .item-price-input{ width:96px; }
  .item-remove-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:22px;
    line-height:1;
    cursor:pointer;
    padding:4px 6px;
    flex-shrink:0;
  }
  .add-item-btn{
    display:block;
    width:100%;
    background:none;
    border:1.5px dashed var(--line-card);
    border-radius:10px;
    padding:10px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    margin-bottom:22px;
  }
  .form-save-btn{
    display:block;
    width:100%;
    background:#F3C16B;
    color:var(--ink);
    border:1px solid var(--line-card);
    border-radius:13px;
    padding:14px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    margin-top:8px;
  }
  .form-save-btn:active{ transform:scale(0.98); }
  .form-error{
    color:#C0604A;
    font-size:13px;
    margin:-8px 0 16px;
    display:none;
  }
  .form-error.show{ display:block; }

  /* 設定画面カードリスト */
  .settings-topbar{
    justify-content:flex-start;
    gap:10px;
  }
  .settings-topbar .settings-title{
    flex:none;
    text-align:left;
  }
  .settings-list{
    display:flex;
    flex-direction:column;
    gap:13px;
    margin-top:6px;
  }
  .settings-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line-card);
    border-radius:18px;
    padding:16px 18px;
    cursor:pointer;
  }
  .settings-card:active{ transform:scale(0.99); }
  .settings-card-icon{
    width:38px; height:38px;
    border-radius:11px;
    background:#F4ECE3;
    color:var(--mustard-deep);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .settings-card-info{ flex:1; min-width:0; }
  .settings-card-title{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:15px;
    font-weight:700;
    margin-bottom:3px;
  }
  .settings-card-desc{
    font-size:12px;
    color:var(--ink-soft);
  }

  /* 月の管理 */
  .month-manage-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:6px;
  }
  .month-manage-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line-card);
    border-radius:14px;
    padding:14px 16px;
  }
  .month-manage-row .m-label{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
  }
  .month-manage-row .m-delete{
    background:#FFFEFD;
    border:1px solid #A27D7F;
    color:#A27D7F;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
    padding:6px 12px;
    font-family:'Zen Maru Gothic', sans-serif;
  }
  .month-manage-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:30px 10px;
  }

  /* 確認ダイアログ(簡易オーバーレイ) */
  .confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(80,48,24,0.35);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .confirm-overlay.open{ display:flex; }
  .confirm-box{
    background:var(--bg);
    border-radius:16px;
    padding:24px 22px;
    max-width:320px;
    width:100%;
    text-align:center;
  }
  .confirm-box p{
    font-size:14.5px;
    color:var(--ink);
    margin:0 0 20px;
    line-height:1.7;
  }
  .confirm-box .confirm-btns{
    display:flex;
    gap:10px;
  }
  .confirm-box button{
    flex:1;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14px;
    font-weight:700;
    border-radius:10px;
    padding:11px;
    cursor:pointer;
  }
  .confirm-cancel{
    background:var(--card);
    border:1px solid var(--line-card);
    color:var(--ink);
  }
  .confirm-ok{
    background:#A27D7F;
    border:1px solid #A27D7F;
    color:#fff;
  }
  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:11px 20px;
    border-radius:10px;
    font-size:13.5px;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
  }
  .toast.show{ opacity:1; }

</style>
</head>

<script>
(function(){
  "use strict";

  /* ===== ストレージキー ===== */
  var REC_KEY = 'tatekaeCho_records';
  var STORE_KEY = 'tatekaeCho_storeStats';

  /* ===== データ読み書き ===== */
  function loadRecords(){
    try{
      var raw = localStorage.getItem(REC_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveRecords(records){
    localStorage.setItem(REC_KEY, JSON.stringify(records));
  }
  function loadStoreStats(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    // 初期候補（未使用でも最初から表示されるよう基礎カウントを付与）
    return {
      'ゆめタウン': { count: 3 },
      'ウォンツ': { count: 3 },
      'アルゾ': { count: 3 }
    };
  }
  function saveStoreStats(stats){
    localStorage.setItem(STORE_KEY, JSON.stringify(stats));
  }
  function bumpStoreStat(name){
    if(!name) return;
    var stats = loadStoreStats();
    if(!stats[name]) stats[name] = { count: 0 };
    stats[name].count += 1;
    saveStoreStats(stats);
  }

  /* ===== ユーティリティ ===== */
  function pad2(n){ return (n<10?'0':'')+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }
  function monthKeyOf(dateStr){
    return dateStr ? dateStr.slice(0,7) : todayStr().slice(0,7);
  }
  function monthLabelOf(monthKey){
    var parts = monthKey.split('-');
    return parts[0]+'年'+parseInt(parts[1],10)+'月';
  }
  var WEEK = ['日','月','火','水','木','金','土'];
  function dateLabelShort(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    return (d.getMonth()+1)+'月'+d.getDate()+'日';
  }
  function dateLabelWithWeek(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WEEK[d.getDay()]+'）';
  }
  function yen(n){
    return '¥'+Math.round(n).toLocaleString('ja-JP');
  }
  function recordTotal(rec){
    var total = 0;
    (rec.items||[]).forEach(function(it){ total += Number(it.price)||0; });
    return total;
  }
  function uid(){
    return 'r'+Date.now()+Math.random().toString(36).slice(2,8);
  }
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  /* ===== 画面切り替え共通 ===== */
  var screens = ['homeScreen','detailScreen','addScreen','settingsScreen','monthManageScreen'];
  function showScreen(id){
    screens.forEach(function(sid){
      var el = document.getElementById(sid);
      if(!el) return;
      if(sid===id){ el.classList.add('active'); }
      else{ el.classList.remove('active'); }
    });
    window.scrollTo(0,0);
  }

  /* ===== 状態 ===== */
  var state = {
    currentMonth: todayStr().slice(0,7),
    currentDetailId: null,
    editingId: null,
    itemRowCount: 0
  };

  /* ===== ホーム画面：月セレクター ===== */
  function getAllMonths(){
    var records = loadRecords();
    var set = {};
    set[todayStr().slice(0,7)] = true; // 当月は常に含める
    records.forEach(function(r){ set[monthKeyOf(r.date)] = true; });
    var months = Object.keys(set);
    months.sort(function(a,b){ return b.localeCompare(a); });
    return months;
  }

  function renderMonthDropdown(){
    var months = getAllMonths();
    var dd = document.getElementById('monthDropdown');
    dd.innerHTML = '';
    months.forEach(function(m){
      var item = document.createElement('div');
      item.className = 'm-item' + (m===state.currentMonth ? ' current' : '');
      item.textContent = monthLabelOf(m);
      item.addEventListener('click', function(){
        state.currentMonth = m;
        document.getElementById('monthLabel').textContent = monthLabelOf(m);
        document.getElementById('monthSelect').classList.remove('open');
        dd.classList.remove('open');
        renderMonthDropdown();
        renderHome();
      });
      dd.appendChild(item);
    });
    document.getElementById('monthLabel').textContent = monthLabelOf(state.currentMonth);
  }

  document.getElementById('monthSelect').addEventListener('click', function(e){
    var open = this.classList.toggle('open');
    document.getElementById('monthDropdown').classList.toggle('open', open);
  });
  document.addEventListener('click', function(e){
    var ms = document.getElementById('monthSelect');
    if(!ms.contains(e.target)){
      ms.classList.remove('open');
      document.getElementById('monthDropdown').classList.remove('open');
    }
  });

  /* ===== ホーム画面：一覧描画 ===== */
  function renderHome(){
    var records = loadRecords().filter(function(r){
      return monthKeyOf(r.date) === state.currentMonth;
    });
    records.sort(function(a,b){ return b.date.localeCompare(a.date); });

    var list = document.getElementById('cardList');
    var empty = document.getElementById('emptyState');
    list.innerHTML = '';

    var totalUnpaid = 0;
    records.forEach(function(r){
      var total = recordTotal(r);
      if(!r.settled) totalUnpaid += total;

      var card = document.createElement('div');
      card.className = 'store-card';
      card.setAttribute('data-id', r.id);
      card.innerHTML =
        '<span class="status-dot'+(r.settled?' settled':'')+'"></span>'+
        '<div class="store-info">'+
          '<div class="store-name"></div>'+
          '<div class="store-date"></div>'+
        '</div>'+
        '<div class="store-right">'+
          '<div class="store-amount-count">'+
            '<span class="store-amount"></span>'+
            '<span class="store-count"></span>'+
          '</div>'+
          '<span class="chevron">›</span>'+
        '</div>';
      card.querySelector('.store-name').textContent = r.store;
      card.querySelector('.store-date').textContent = dateLabelShort(r.date);
      card.querySelector('.store-amount').textContent = yen(total);
      card.querySelector('.store-count').textContent = (r.items||[]).length+'件';
      card.addEventListener('click', function(){ openDetail(r.id); });
      list.appendChild(card);
    });

    document.getElementById('totalUnpaid').textContent = yen(totalUnpaid);

    if(records.length===0){
      list.style.display = 'none';
      empty.style.display = 'block';
    }else{
      list.style.display = 'flex';
      empty.style.display = 'none';
    }
  }

  /* ===== 詳細画面 ===== */
  function openDetail(id){
    state.currentDetailId = id;
    renderDetail();
    showScreen('detailScreen');
  }
  function renderDetail(){
    var records = loadRecords();
    var rec = records.filter(function(r){ return r.id===state.currentDetailId; })[0];
    if(!rec) { showScreen('homeScreen'); return; }

    document.getElementById('detailStoreName').textContent = rec.store;
    document.getElementById('detailDateBadge').textContent = dateLabelWithWeek(rec.date);
    document.getElementById('detailTotalValue').textContent = yen(recordTotal(rec));

    var list = document.getElementById('detailItemList');
    list.innerHTML = '';
    (rec.items||[]).forEach(function(it){
      var row = document.createElement('div');
      row.className = 'detail-item-row';
      row.innerHTML =
        '<span class="detail-item-dot"></span>'+
        '<span class="detail-item-name"></span>'+
        '<span class="detail-item-price"></span>';
      row.querySelector('.detail-item-name').textContent = it.name;
      row.querySelector('.detail-item-price').textContent = yen(Number(it.price)||0);
      list.appendChild(row);
    });

    var memoText = document.getElementById('detailMemoText');
    var memoInput = document.getElementById('detailMemoInput');
    memoText.textContent = rec.memo ? rec.memo : 'メモを追加';
    memoInput.value = rec.memo || '';
    memoInput.style.display = 'none';
    memoText.parentElement.style.display = 'flex';

    var settleBtn = document.getElementById('detailSettleBtn');
    settleBtn.textContent = rec.settled ? '精算済みを取り消す' : '精算済みにする';
  }

  document.getElementById('detailBackBtn').addEventListener('click', function(){
    renderHome(); renderMonthDropdown();
    showScreen('homeScreen');
  });

  document.getElementById('detailMemoRow').addEventListener('click', function(){
    this.style.display = 'none';
    var input = document.getElementById('detailMemoInput');
    input.style.display = 'block';
    input.focus();
  });
  document.getElementById('detailMemoInput').addEventListener('blur', function(){
    var records = loadRecords();
    var rec = records.filter(function(r){ return r.id===state.currentDetailId; })[0];
    if(rec){
      rec.memo = this.value.trim();
      saveRecords(records);
    }
    this.style.display = 'none';
    renderDetail();
  });

  document.getElementById('detailSettleBtn').addEventListener('click', function(){
    var records = loadRecords();
    var rec = records.filter(function(r){ return r.id===state.currentDetailId; })[0];
    if(rec){
      rec.settled = !rec.settled;
      saveRecords(records);
      renderDetail();
      showToast(rec.settled ? '精算済みにしました' : '未精算に戻しました');
    }
  });

  document.getElementById('detailDeleteBtn').addEventListener('click', function(){
    confirmDialog('この記録を削除してもよいですか？', function(){
      var records = loadRecords().filter(function(r){ return r.id!==state.currentDetailId; });
      saveRecords(records);
      renderMonthDropdown();
      renderHome();
      showScreen('homeScreen');
      showToast('削除しました');
    });
  });

  document.getElementById('detailEditBtn').addEventListener('click', function(){
    openEditForm(state.currentDetailId);
  });

  /* ===== 記録追加・編集画面 ===== */
  function resetAddForm(){
    document.getElementById('storeInput').value = '';
    document.getElementById('dateInput').value = todayStr();
    document.getElementById('memoInput').value = '';
    document.getElementById('formError').classList.remove('show');
    document.getElementById('itemInputRows').innerHTML = '';
    state.itemRowCount = 0;
    addItemRow(); addItemRow();
    closeAutocomplete();
  }
  function addItemRow(name, price){
    state.itemRowCount++;
    var wrap = document.getElementById('itemInputRows');
    var row = document.createElement('div');
    row.className = 'item-input-row';
    row.innerHTML =
      '<input type="text" class="form-input item-name-input" placeholder="品目名">'+
      '<input type="number" inputmode="numeric" class="form-input item-price-input" placeholder="金額">'+
      '<button type="button" class="item-remove-btn" aria-label="削除">×</button>';
    row.querySelector('.item-name-input').value = name || '';
    row.querySelector('.item-price-input').value = (price===undefined || price===null) ? '' : price;
    row.querySelector('.item-remove-btn').addEventListener('click', function(){
      row.remove();
    });
    wrap.appendChild(row);
  }
  document.getElementById('addItemRowBtn').addEventListener('click', function(){ addItemRow(); });

  function openAddForm(){
    state.editingId = null;
    document.getElementById('addScreenTitle').textContent = '記録を追加';
    resetAddForm();
    showScreen('addScreen');
  }
  function openEditForm(id){
    var records = loadRecords();
    var rec = records.filter(function(r){ return r.id===id; })[0];
    if(!rec) return;
    state.editingId = id;
    document.getElementById('addScreenTitle').textContent = '記録を編集';
    document.getElementById('storeInput').value = rec.store;
    document.getElementById('dateInput').value = rec.date;
    document.getElementById('memoInput').value = rec.memo || '';
    document.getElementById('formError').classList.remove('show');
    var wrap = document.getElementById('itemInputRows');
    wrap.innerHTML = '';
    state.itemRowCount = 0;
    (rec.items||[]).forEach(function(it){ addItemRow(it.name, it.price); });
    if((rec.items||[]).length===0){ addItemRow(); addItemRow(); }
    closeAutocomplete();
    showScreen('addScreen');
  }

  document.getElementById('addBtn').addEventListener('click', function(){
    openAddForm();
  });
  document.getElementById('addBackBtn').addEventListener('click', function(){
    if(state.editingId){
      renderDetail();
      showScreen('detailScreen');
    }else{
      showScreen('homeScreen');
    }
  });

  document.getElementById('saveRecordBtn').addEventListener('click', function(){
    var store = document.getElementById('storeInput').value.trim();
    var date = document.getElementById('dateInput').value || todayStr();
    var memo = document.getElementById('memoInput').value.trim();
    var rows = document.querySelectorAll('#itemInputRows .item-input-row');
    var items = [];
    rows.forEach(function(row){
      var name = row.querySelector('.item-name-input').value.trim();
      var price = row.querySelector('.item-price-input').value;
      if(name && price!==''){
        items.push({ name: name, price: Number(price)||0 });
      }
    });

    var errEl = document.getElementById('formError');
    if(!store || !date || items.length===0){
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');

    var records = loadRecords();

    if(state.editingId){
      var rec = records.filter(function(r){ return r.id===state.editingId; })[0];
      if(rec){
        rec.store = store;
        rec.date = date;
        rec.items = items;
        rec.memo = memo;
      }
      saveRecords(records);
      bumpStoreStat(store);

      state.currentMonth = monthKeyOf(date);
      renderMonthDropdown();
      renderHome();
      state.currentDetailId = state.editingId;
      state.editingId = null;
      renderDetail();
      showScreen('detailScreen');
      showToast('記録を更新しました');
    }else{
      records.push({
        id: uid(),
        store: store,
        date: date,
        items: items,
        memo: memo,
        settled: false
      });
      saveRecords(records);
      bumpStoreStat(store);

      state.currentMonth = monthKeyOf(date);
      renderMonthDropdown();
      renderHome();
      showScreen('homeScreen');
      showToast('記録を保存しました');
    }
  });

  /* ===== お店名オートコンプリート ===== */
  var acActiveIndex = -1;
  function closeAutocomplete(){
    var list = document.getElementById('storeAutocompleteList');
    list.classList.remove('open');
    list.innerHTML = '';
    acActiveIndex = -1;
  }
  function renderAutocomplete(query){
    var stats = loadStoreStats();
    var names = Object.keys(stats);
    var results;
    if(!query){
      // 未入力時：利用回数の多い順、上位5件（1〜2回のみの店は除外）
      results = names
        .filter(function(n){ return (stats[n].count||0) >= 3; })
        .sort(function(a,b){ return (stats[b].count||0)-(stats[a].count||0); })
        .slice(0,5);
    }else{
      // 入力中：部分一致するものは回数に関わらず表示
      results = names
        .filter(function(n){ return n.indexOf(query) !== -1; })
        .sort(function(a,b){ return (stats[b].count||0)-(stats[a].count||0); })
        .slice(0,8);
    }

    var list = document.getElementById('storeAutocompleteList');
    list.innerHTML = '';
    if(results.length===0){ closeAutocomplete(); return; }
    results.forEach(function(name){
      var item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.textContent = name;
      item.addEventListener('mousedown', function(e){
        e.preventDefault();
        document.getElementById('storeInput').value = name;
        closeAutocomplete();
      });
      list.appendChild(item);
    });
    list.classList.add('open');
  }
  var storeInputEl = document.getElementById('storeInput');
  storeInputEl.addEventListener('focus', function(){
    renderAutocomplete(this.value.trim());
  });
  storeInputEl.addEventListener('input', function(){
    renderAutocomplete(this.value.trim());
  });
  storeInputEl.addEventListener('blur', function(){
    setTimeout(closeAutocomplete, 120);
  });

  /* ===== 設定画面 ===== */
  document.getElementById('settingsBtn').addEventListener('click', function(){
    showScreen('settingsScreen');
  });
  document.getElementById('settingsBackBtn').addEventListener('click', function(){
    showScreen('homeScreen');
  });

  /* --- 月の管理 --- */
  document.getElementById('goMonthManage').addEventListener('click', function(){
    renderMonthManage();
    showScreen('monthManageScreen');
  });
  document.getElementById('monthManageBackBtn').addEventListener('click', function(){
    showScreen('settingsScreen');
  });
  function renderMonthManage(){
    var months = getAllMonths();
    var list = document.getElementById('monthManageList');
    list.innerHTML = '';
    if(months.length===0){
      list.innerHTML = '<div class="month-manage-empty">管理できる月がありません</div>';
      return;
    }
    months.forEach(function(m){
      var row = document.createElement('div');
      row.className = 'month-manage-row';
      row.innerHTML =
        '<span class="m-label"></span>'+
        '<button type="button" class="m-delete">削除</button>';
      row.querySelector('.m-label').textContent = monthLabelOf(m);
      row.querySelector('.m-delete').addEventListener('click', function(){
        confirmDialog('『'+monthLabelOf(m)+'』の記録をすべて削除してもよいですか？', function(){
          var records = loadRecords().filter(function(r){ return monthKeyOf(r.date)!==m; });
          saveRecords(records);
          if(state.currentMonth===m){ state.currentMonth = todayStr().slice(0,7); }
          renderMonthManage();
          renderMonthDropdown();
          renderHome();
          showToast('削除しました');
        });
      });
      list.appendChild(row);
    });
  }

  /* --- バックアップ --- */
  document.getElementById('doBackup').addEventListener('click', function(){
    var data = {
      records: loadRecords(),
      storeStats: loadStoreStats(),
      exportedAt: new Date().toISOString()
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    a.href = url;
    a.download = 'tatekaecho-backup-'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('バックアップを書き出しました');
  });

  /* --- 復元 --- */
  document.getElementById('doRestore').addEventListener('click', function(){
    document.getElementById('restoreFileInput').click();
  });
  document.getElementById('restoreFileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try{
        data = JSON.parse(reader.result);
      }catch(err){
        showToast('ファイルの読み込みに失敗しました');
        return;
      }
      if(!data || !Array.isArray(data.records)){
        showToast('正しいバックアップファイルではありません');
        return;
      }
      confirmDialog('現在のデータを上書きして復元してもよいですか？', function(){
        saveRecords(data.records);
        saveStoreStats(data.storeStats || loadStoreStats());
        state.currentMonth = todayStr().slice(0,7);
        renderMonthDropdown();
        renderHome();
        showScreen('homeScreen');
        showToast('復元しました');
      });
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ===== 確認ダイアログ ===== */
  var confirmCallback = null;
  function confirmDialog(message, onOk){
    document.getElementById('confirmMessage').textContent = message;
    confirmCallback = onOk;
    document.getElementById('confirmOverlay').classList.add('open');
  }
  document.getElementById('confirmCancelBtn').addEventListener('click', function(){
    document.getElementById('confirmOverlay').classList.remove('open');
    confirmCallback = null;
  });
  document.getElementById('confirmOkBtn').addEventListener('click', function(){
    document.getElementById('confirmOverlay').classList.remove('open');
    if(confirmCallback) confirmCallback();
    confirmCallback = null;
  });

  /* ===== 初期化 ===== */
  renderMonthDropdown();
  renderHome();
  showScreen('homeScreen');

})();
</script>
</body>
</html>
